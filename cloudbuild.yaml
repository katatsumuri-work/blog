# Hugo でビルドして Firebase Hosting に出す。
#
# GitHub Actions の schedule が当てにならず、未来日記事の当日公開が
# 成立しなかったため、公開経路を GCP 内に移した。
# 経緯: blog の記事 2026-09-19-scheduled-workflow-silently-stops.md
#
# 呼ばれ方は 3 つ。
#   - push（main）        … Cloud Build の GitHub 連携トリガー
#   - 日次                … Cloud Scheduler（未来日記事を当日に公開するため）
#   - 手動                … gcloud builds triggers run blog-deploy --branch=main
#
# 認証は Cloud Build のサービスアカウント（ADC）。長期鍵は使わない。

substitutions:
  _HUGO_VERSION: '0.161.1'
  # firebase-tools も固定する。未固定だと毎回その時点の最新が降ってきて、
  # ある朝いきなり壊れる（Node の要求バージョンが上がる等）余地が残る。
  # 上げるときは手元で確認してから:
  #   docker run --rm --platform linux/amd64 node:22-slim \
  #     bash -c 'npx --yes firebase-tools@<version> --version'
  _FIREBASE_TOOLS_VERSION: '15.30.0'

steps:
  # Hugo は cloud-builders に無いので公式リリースを取得する。
  # extended 版が要る（テーマは自前だが、将来 SCSS を使う可能性を残す）。
  #
  # ベースイメージに注意。gcr.io/cloud-builders/* は glibc が古く、
  # hugo extended が動かない（GLIBC_2.33 / GLIBCXX_3.4.29 not found で落ちる）。
  # extended はネイティブライブラリに依存するので、新しめのディストロが要る。
  # ビルドと取得を 1 ステップにまとめているのは、/workspace を跨ぐより素直なため。
  - id: build
    name: debian:12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates

        # 取得したアーカイブは必ず checksum を検証してから展開する。
        # 配信事故や供給元の侵害を素通りさせないため。
        # sha256sum は改ざん時も対象が無いときも非ゼロで落ちる（fail-closed）。
        base="https://github.com/gohugoio/hugo/releases/download/v${_HUGO_VERSION}"
        tarball="hugo_extended_${_HUGO_VERSION}_linux-amd64.tar.gz"
        workdir="$(mktemp -d)"
        curl -sSLo "$workdir/$tarball"       "$base/$tarball"
        curl -sSLo "$workdir/checksums.txt"  "$base/hugo_${_HUGO_VERSION}_checksums.txt"
        ( cd "$workdir" && sha256sum --check --ignore-missing checksums.txt )
        tar -xzf "$workdir/$tarball" -C /usr/local/bin hugo
        rm -rf "$workdir"

        hugo version
        # 未来日の記事は既定で除外される（buildFuture=false）。
        # それが当日公開の仕組みなので、--buildFuture は付けない。
        hugo --gc --minify

  # firebase.json の site 指定で katatsumuri-blog に出る。
  # web（既定サイト）へ誤爆しない。
  #
  # ベースイメージに注意。gcr.io/cloud-builders/npm は Node が v19 で、
  # firebase-tools が動かない（incompatible with Node.js v19.0.0 で落ちる）。
  # cloud-builders のイメージは全体的に古いので、公式イメージを使う。
  - id: deploy
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npx --yes "firebase-tools@${_FIREBASE_TOOLS_VERSION}" deploy \
          --only hosting \
          --project "$PROJECT_ID" \
          --non-interactive \
          --message "${SHORT_SHA:-manual} (cloud-build)"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 900s
